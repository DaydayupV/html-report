<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>策略总览</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1;
    --surface: #ffffff;
    --surface-2: #f8f8f6;
    --ink: #111110;
    --ink-2: #52514e;
    --muted: #87857f;
    --grid: #ebeae4;
    --axis: #c9c8bf;
    --border: rgba(17, 17, 16, 0.10);
    --accent: #2a78d6;
    --accent-rgb: 42, 120, 214;
    --bench: #a3a199;
    --oos-rgb: 135, 133, 127;
    --up: #c9302c;
    --up-rgb: 214, 64, 60;
    --down: #12803a;
    --down-rgb: 24, 150, 72;
    --good: #0a7a0a;
    --warn-ink: #8a5300;
    --warn-bg: #fff5de;
    --warn-line: #f1c66b;
    --shadow: 0 1px 2px rgba(17, 17, 16, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0e0e0d;
      --surface: #1a1a19;
      --surface-2: #222220;
      --ink: #f5f5f2;
      --ink-2: #c3c2b7;
      --muted: #8f8d86;
      --grid: #2c2c2a;
      --axis: #44443f;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #4a92ea;
      --accent-rgb: 74, 146, 234;
      --bench: #7d7b74;
      --oos-rgb: 160, 158, 150;
      --up: #f26b66;
      --up-rgb: 242, 107, 102;
      --down: #45c272;
      --down-rgb: 69, 194, 114;
      --good: #3fc23f;
      --warn-ink: #f3c062;
      --warn-bg: rgba(250, 178, 25, 0.10);
      --warn-line: rgba(250, 178, 25, 0.35);
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0e0e0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #f5f5f2;
    --ink-2: #c3c2b7;
    --muted: #8f8d86;
    --grid: #2c2c2a;
    --axis: #44443f;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #4a92ea;
    --accent-rgb: 74, 146, 234;
    --bench: #7d7b74;
    --oos-rgb: 160, 158, 150;
    --up: #f26b66;
    --up-rgb: 242, 107, 102;
    --down: #45c272;
    --down-rgb: 69, 194, 114;
    --good: #3fc23f;
    --warn-ink: #f3c062;
    --warn-bg: rgba(250, 178, 25, 0.10);
    --warn-line: rgba(250, 178, 25, 0.35);
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  a { color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .muted { color: var(--muted); }
  .sub { color: var(--ink-2); }

  /* 顶部 */
  .site-header { padding: 28px 0 12px; }
  .site-header h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: 0.01em; }
  .site-header .gen { margin-top: 2px; font-size: 13px; color: var(--muted); }

  .tabs-bar { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--border); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 4px; padding-bottom: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: block; padding: 10px 14px 9px; text-decoration: none; color: var(--ink-2);
    font-size: 15px; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }

  main { padding-top: 20px; padding-bottom: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .card > h3, .card-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
  .card-note { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

  /* 策略头部 */
  .intro { margin: 4px 0 18px; }
  .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .title-row h2 { margin: 0; font-size: 26px; font-weight: 650; }
  .badge {
    display: inline-block; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 999px;
    color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border);
  }
  .intro .desc { margin: 8px 0 0; font-size: 15px; color: var(--ink); max-width: 760px; }
  .intro .meta { margin: 6px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 18px; }
  .intro .meta span { white-space: nowrap; }

  .top-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
  .top-grid > .card { margin-bottom: 0; }

  /* 指标 */
  .hero-label { font-size: 13px; color: var(--ink-2); }
  .hero-value { font-size: 44px; line-height: 1.15; font-weight: 650; margin: 4px 0 6px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .hero-sub { font-size: 14px; color: var(--ink-2); }
  .hero-sub b { font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin-top: 18px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tile { background: var(--surface); padding: 12px 14px; min-width: 0; }
  .tile-label { font-size: 13px; color: var(--ink-2); }
  .tile-value { font-size: 20px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
  .tile-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 最新选股 */
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 10px; border-radius: 999px; }
  .status.ok { color: var(--good); background: rgba(12, 163, 12, 0.08); }
  .status.stale { color: var(--warn-ink); background: var(--warn-bg); }
  .status svg { flex: none; }
  .warn-box {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.55;
    color: var(--warn-ink); background: var(--warn-bg); border: 1px solid var(--warn-line);
  }
  .timeline { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
  .timeline b { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .pick-list { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--border); }
  .pick-list li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .pick-name { font-size: 18px; font-weight: 600; }
  .pick-code { margin-left: 8px; font-size: 13px; color: var(--muted); }
  .pick-weight { font-size: 14px; color: var(--ink-2); white-space: nowrap; }
  .pick-weight b { color: var(--ink); font-weight: 600; font-size: 16px; }
  .trade-note { margin: 12px 0 0; font-size: 13px; color: var(--ink-2); }
  .empty { padding: 18px 0; color: var(--muted); font-size: 14px; }

  /* 图表 */
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .line { width: 16px; height: 0; border-top: 2px solid; border-radius: 2px; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .toggle {
    font: inherit; font-size: 13px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 12px; cursor: pointer;
  }
  .toggle[aria-pressed="true"] { color: var(--ink); border-color: rgba(var(--accent-rgb), 0.55); background: rgba(var(--accent-rgb), 0.08); }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .range-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 10px; }
  .range-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .plot { position: relative; touch-action: pan-y; outline: none; border-radius: 6px; }
  .plot:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .plot svg { display: block; width: 100%; overflow: visible; }
  .plot-label { margin: 10px 0 2px; font-size: 13px; color: var(--ink-2); }
  .axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .end-text {
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
    paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round;
  }
  .nowrap { white-space: nowrap; }
  .tooltip {
    position: absolute; top: 6px; left: 0; pointer-events: none; z-index: 5; min-width: 150px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); font-size: 12px; line-height: 1.5; display: none;
  }
  .tooltip .tt-date { color: var(--ink-2); margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .tooltip .tt-key { width: 12px; height: 0; border-top: 2px solid; flex: none; }
  .tooltip .tt-val { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tooltip .tt-name { color: var(--ink-2); }

  details.data-view { margin-top: 14px; }
  details.data-view summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
  details.data-view summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .data-scroll { max-height: 360px; overflow: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; }

  /* 表格 */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { font-weight: 500; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; }
  th:first-child, td:first-child { text-align: left; }
  td { font-variant-numeric: tabular-nums; }
  .monthly td { min-width: 58px; }
  .monthly td.year { font-weight: 600; }
  .monthly td.total { font-weight: 600; }

  /* 历史选股 */
  .search {
    font: inherit; font-size: 14px; width: 220px; max-width: 100%; padding: 6px 12px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .hist { width: 100%; }
  .hist th { text-align: left; }
  .hist td { vertical-align: top; white-space: normal; text-align: left; }
  .hist td.date { white-space: nowrap; width: 1%; }
  .hist td.buy { white-space: nowrap; width: 1%; color: var(--ink-2); }
  .hist .buy-inline { display: none; font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .chip { white-space: nowrap; }
  .chip .c { color: var(--muted); margin-left: 4px; }
  .chip .w { color: var(--ink-2); margin-left: 6px; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  .pager button {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 12px; cursor: pointer;
  }
  .pager button:disabled { color: var(--muted); cursor: default; opacity: 0.6; }
  .pager button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 说明 */
  .notes ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
  .notes li + li { margin-top: 4px; }
  .disclaimer { padding: 8px 16px 40px; font-size: 12px; color: var(--muted); line-height: 1.7; }

  /* 总览 */
  .ov-intro { margin: 4px 0 16px; color: var(--ink-2); font-size: 14px; }
  .ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .ov-card {
    display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 18px 14px; box-shadow: var(--shadow); transition: border-color 0.15s;
  }
  .ov-card:hover { border-color: rgba(var(--accent-rgb), 0.5); }
  .ov-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ov-name { font-size: 18px; font-weight: 650; }
  .ov-desc { margin-top: 2px; font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
  .ov-value { font-size: 32px; font-weight: 650; line-height: 1.2; margin-top: 12px; }
  .ov-value-label { font-size: 12px; color: var(--muted); }
  .ov-spark { display: block; width: 100%; height: 44px; margin: 10px 0 8px; }
  .ov-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); padding-top: 8px; border-top: 1px solid var(--border); }
  .ov-row + .ov-row { border-top: 0; padding-top: 2px; }

  @media (max-width: 860px) {
    .top-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    body { font-size: 14px; }
    .site-header { padding-top: 20px; }
    .card { padding: 16px; border-radius: 10px; }
    .title-row h2 { font-size: 22px; }
    .hero-value { font-size: 36px; }
    .tile-value { font-size: 18px; }
    .search { width: 100%; }
    .card-head { align-items: flex-start; }
    th, td { padding: 7px 8px; }
    .hist th.buy, .hist td.buy { display: none; }
    .hist .buy-inline { display: block; }
  }
</style>
</head>

<script>

  var SVG_NS = "http://www.w3.org/2000/svg";
  var WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  // ---------- 基础工具 ----------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);

    appendChildren(node, children);

  }
  function svg(tag, attrs, children) {
    var node = document.createElementNS(SVG_NS, tag);
    applyAttrs(node, attrs);
    appendChildren(node, children);
    return node;
  }
  function applyAttrs(node, attrs) {
    if (!attrs) return;
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "text") node.textContent = v;
      else if (k === "class") node.setAttribute("class", v);
      else if (k === "style") node.setAttribute("style", v);
      else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    });
  }
  function appendChildren(node, children) {
    if (children === null || children === undefined) return;
    if (!Array.isArray(children)) children = [children];
    children.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
    });
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }

  var groupFmt2 = new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function fmtPct(v, digits, signed) {
    if (!isNum(v)) return "—";
    if (digits === undefined) digits = 2;
    var x = v * 100;
    var body = Math.abs(x) >= 10000
      ? new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 }).format(Math.abs(x))
      : new Intl.NumberFormat("zh-CN", { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(Math.abs(x));
    var sign = x < 0 && Number(body.replace(/,/g, "")) !== 0 ? "−" : (signed !== false && x > 0 ? "+" : "");
    return sign + body + "%";
  }
  function fmtWeight(v) {
    if (!isNum(v)) return "—";
    var x = Math.round(v * 1000) / 10;
    return (x % 1 === 0 ? x.toFixed(0) : x.toFixed(1)) + "%";
  }
  function fmtNav(v) {
    if (!isNum(v)) return "—";
    if (v >= 1000) return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 }).format(v);
    if (v >= 100) return v.toFixed(1);
    return v.toFixed(4);
  }
  function signClass(v) { return !isNum(v) ? "" : v > 0 ? "up" : v < 0 ? "down" : ""; }

    return WEEKDAYS[dt.getDay()];
  }
  function dateWithWeekday(d) { return d ? d + "（" + weekday(d) + "）" : "—"; }

  }

  function currentId() {
    var id = decodeURIComponent(location.hash.replace(/^#/, ""));

  function route(scroll) {

  // ---------- 总览 ----------
  function renderOverview(view) {

    var grid = el("div", { class: "ov-grid" });
    STRATEGIES.forEach(function (s) {

      var lp = s.latest_picks;
      var latestText = !lp ? "暂无" : lp.select_date + (lp.status === "stale" ? "（未更新）" : "");

      ]));
    });
    view.appendChild(grid);
  }

  function sparkline(series) {
    var nav = (series && series.nav) || [];
    var node = svg("svg", { class: "ov-spark", viewBox: "0 0 100 40", preserveAspectRatio: "none", "aria-hidden": "true" });
    if (nav.length < 2) return node;
    var lo = Math.min.apply(null, nav), hi = Math.max.apply(null, nav);
    var useLog = lo > 0 && hi / lo > 8;
    var f = function (v) { return useLog ? Math.log(v) : v; };
    var a = f(lo), b = f(hi), span = b - a || 1;
    var d = "";
    nav.forEach(function (v, i) {
      var x = i / (nav.length - 1) * 100;
      var y = 37 - (f(v) - a) / span * 34;
      d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    });
    var baseY = 37 - (f(1) - a) / span * 34;
    if (baseY >= 0 && baseY <= 40) {
      node.appendChild(svg("line", { x1: 0, x2: 100, y1: baseY, y2: baseY, stroke: "var(--axis)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" }));
    }
    node.appendChild(svg("path", { d: d, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }));
    return node;
  }

  function renderMetrics(s) {

      hover.crossLine.setAttribute("x1", x); hover.crossLine.setAttribute("x2", x);
      hover.dotS.setAttribute("cx", x); hover.dotS.setAttribute("cy", geo.yAt(nav[i]));
      if (bench && isNum(bench[i]) && !(geo.useLog && bench[i] <= 0)) {
        hover.dotB.style.display = "";
        hover.dotB.setAttribute("cx", x); hover.dotB.setAttribute("cy", geo.yAt(bench[i]));
      } else {
        hover.dotB.style.display = "none";
      }
      hover.crossDd.style.display = "";
      hover.crossDd.setAttribute("x1", x); hover.crossDd.setAttribute("x2", x);
      hover.dotDd.style.display = "";
      hover.dotDd.setAttribute("cx", x); hover.dotDd.setAttribute("cy", geo.yDd(isNum(dd[i]) ? dd[i] : 0));

      tooltip.textContent = "";
      tooltip.appendChild(el("div", { class: "tt-date", text: dateWithWeekday(dates[i]) }));
      tooltip.appendChild(ttRow("var(--accent)", fmtNav(nav[i]) + "（" + fmtPct(nav[i] - 1) + "）", "策略"));
      if (bench) tooltip.appendChild(ttRow("var(--bench)", isNum(bench[i]) ? fmtNav(bench[i]) + "（" + fmtPct(bench[i] - 1) + "）" : "—", bName));
      tooltip.appendChild(ttRow(null, fmtPct(dd[i]), "回撤"));
      tooltip.style.display = "block";
      var tw = tooltip.offsetWidth;
      var left = x + 14;
      if (left + tw > geo.W - 4) left = x - tw - 14;
      tooltip.style.left = Math.max(0, left) + "px";
    }

    function ttRow(color, value, name) {
      return el("div", { class: "tt-row" }, [
        el("span", { class: "tt-key", style: color ? "border-color:" + color : "border-color: transparent" }),
        el("span", { class: "tt-val", text: value }),
        el("span", { class: "tt-name", text: name })
      ]);
    }

    function indexFromEvent(ev, host) {
      var rect = host.getBoundingClientRect();
      var px = (ev.clientX - rect.left) * (geo.W / rect.width);
      return Math.round((px - geo.m.l) / geo.iw * (n - 1));
    }
    [plotNav, plotDd].forEach(function (host) {
      host.addEventListener("pointermove", function (ev) { if (geo) showIndex(indexFromEvent(ev, host)); });
      host.addEventListener("pointerdown", function (ev) { if (geo) showIndex(indexFromEvent(ev, host)); });
      host.addEventListener("pointerleave", function (ev) { if (ev.pointerType === "mouse") hideHover(); });
    });
    plotNav.addEventListener("keydown", function (ev) {
      var step = ev.shiftKey ? 20 : 1;
      var cur = state.idx === null ? n - 1 : state.idx;
      if (ev.key === "ArrowLeft") { showIndex(cur - step); ev.preventDefault(); }
      else if (ev.key === "ArrowRight") { showIndex(cur + step); ev.preventDefault(); }
      else if (ev.key === "Home") { showIndex(0); ev.preventDefault(); }
      else if (ev.key === "End") { showIndex(n - 1); ev.preventDefault(); }
      else if (ev.key === "Escape") { hideHover(); }
    });
    plotNav.addEventListener("focus", function () { if (state.idx === null) showIndex(n - 1); });
    plotNav.addEventListener("blur", hideHover);
    toggle.addEventListener("click", function () {
      state.log = !state.log;
      state.logTouched = true;
      toggle.setAttribute("aria-pressed", state.log ? "true" : "false");
      draw();
    });

    var raf = 0;
    var schedule = function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(schedule);
      ro.observe(plotNav);
      activeCleanup.push(function () { ro.disconnect(); });
    } else {
      window.addEventListener("resize", schedule);
      activeCleanup.push(function () { window.removeEventListener("resize", schedule); });
    }
    requestAnimationFrame(draw);
    return card;
  }

  // getSeries 返回图上当前区间的数据；切换区间后调用 refresh 重建表格
  function renderDataView(s, getSeries) {
    var details = el("details", { class: "data-view" }, [el("summary", { text: "查看每日净值数据表" })]);
    var host = null;
    function build() {
      var series = getSeries();
      var hasBench = !!series.benchmark_nav;
      var head = ["日期", "策略净值", "累计收益"];
      if (hasBench) head.push(benchName(s) + "净值");
      head.push("回撤");
      var tbody = el("tbody");
      for (var i = series.dates.length - 1; i >= 0; i--) {
        var cells = [
          el("td", { text: series.dates[i] }),
          el("td", { text: fmtNav(series.nav[i]) }),
          el("td", { class: signClass(series.nav[i] - 1), text: fmtPct(series.nav[i] - 1) })
        ];
        if (hasBench) cells.push(el("td", { text: fmtNav(series.benchmark_nav[i]) }));
        cells.push(el("td", { text: fmtPct(series.drawdown[i]) }));
        tbody.appendChild(el("tr", null, cells));
      }
      host = el("div", { class: "data-scroll" }, el("table", null, [
        el("thead", null, el("tr", null, head.map(function (h) { return el("th", { text: h }); }))),
        tbody
      ]));
      details.appendChild(host);
    }
    details.addEventListener("toggle", function () { if (details.open && !host) build(); });
    details.refresh = function () {
      if (host) { details.removeChild(host); host = null; }
      if (details.open) build();
    };
    return details;
  }

  // ---------- 月度收益 ----------
  function renderMonthly(s) {
    var ranges = [{ start_date: s.oos_start_date, monthly: s.monthly, main: true }];
    if (s.chart_range && s.chart_range.monthly) ranges.push(s.chart_range);
    var note = el("p", { class: "card-note" });
    var host = el("div", { class: "table-scroll" });
    function show(k) {
      var r = ranges[k];
      note.textContent = (r.main ? "只统计样本外起点之后的交易日" : "只统计 " + r.start_date + " 之后的交易日") +
        "，首尾月份可能不完整；底色越深，当月涨跌幅度越大（红涨绿跌）";
      host.textContent = "";
      host.appendChild(monthlyTable(r.monthly));
    }
    var switcher = rangeSwitch(ranges, "月度收益区间", show);
    show(0);
    return el("section", { class: "card" }, [
      el("div", { class: "card-head" }, [el("div", null, [el("h3", { text: "月度收益" }), note])]),
      switcher.row,
      host
    ]);
  }

  function monthlyTable(monthly) {
    var rows = monthly.slice().sort(function (a, b) { return b.year - a.year; });
    var maxAbs = 0;
    rows.forEach(function (r) { r.months.forEach(function (v) { if (isNum(v)) maxAbs = Math.max(maxAbs, Math.abs(v)); }); });
    var head = ["年份"];
    for (var k = 1; k <= 12; k++) head.push(k + "月");
    head.push("全年");
    var tbody = el("tbody");
    rows.forEach(function (r) {
      var cells = [el("td", { class: "year", text: String(r.year) })];
      r.months.forEach(function (v) {
        var td = el("td", { text: isNum(v) ? fmtPct(v, 1) : "" });
        if (isNum(v) && v !== 0 && maxAbs > 0) {
          var a = (0.06 + Math.abs(v) / maxAbs * 0.30).toFixed(3);
          td.style.background = "rgba(var(" + (v > 0 ? "--up-rgb" : "--down-rgb") + "), " + a + ")";
        }
        cells.push(td);
      });
      cells.push(el("td", { class: "total " + signClass(r.total), text: fmtPct(r.total, 1) }));
      tbody.appendChild(el("tr", null, cells));
    });
    return el("table", { class: "monthly" }, [
      el("thead", null, el("tr", null, head.map(function (h) { return el("th", { text: h }); }))),
      tbody
    ]);
  }

  // ---------- 历史选股 ----------
  function renderHistory(s) {
    var all = s.history_picks || [];
    var PAGE = 20;
    var state = { q: "", page: 0 };
    var search = el("input", { class: "search", type: "search", placeholder: "搜索股票代码、名称或日期", "aria-label": "搜索历史选股" });
    var countNode = el("p", { class: "card-note" });
    var tableHost = el("div", { class: "table-scroll" });
    var prev = el("button", { type: "button", text: "上一页" });
    var next = el("button", { type: "button", text: "下一页" });
    var pageText = el("span", { class: "num" });
    var pager = el("div", { class: "pager" }, [prev, pageText, next]);

    function matches(day, q) {
      if (!q) return true;
      if (day.select_date.indexOf(q) >= 0) return true;
      return day.picks.some(function (p) {
        return String(p.code).toLowerCase().indexOf(q) >= 0 || shortCode(p.code).indexOf(q) >= 0 || String(p.name).toLowerCase().indexOf(q) >= 0;
      });
    }

    function render() {
      var q = state.q.trim().toLowerCase();
      var rows = all.filter(function (d) { return matches(d, q); });
      var pages = Math.max(1, Math.ceil(rows.length / PAGE));
      state.page = Math.min(state.page, pages - 1);
      countNode.textContent = q
        ? "找到 " + rows.length + " 个选股日（共 " + all.length + " 个）"
        : "样本外起点 " + s.oos_start_date + " 之后共 " + all.length + " 个选股日，按当前策略规则对历史数据计算";
      tableHost.textContent = "";
      if (!rows.length) {
        tableHost.appendChild(el("div", { class: "empty", text: all.length ? "没有符合条件的记录。" : "样本外期内暂无选股记录。" }));
      } else {
        var tbody = el("tbody");
        rows.slice(state.page * PAGE, state.page * PAGE + PAGE).forEach(function (d) {
          var chips = el("div", { class: "chips" }, d.picks.map(function (p) {
            return el("span", { class: "chip" }, [p.name, el("span", { class: "c num", text: shortCode(p.code) }), el("span", { class: "w num", text: fmtWeight(p.weight) })]);
          }));
          var buy = d.buy_date ? d.buy_date.slice(5) + " " + (d.buy_time || "") : "—";
          tbody.appendChild(el("tr", null, [
            el("td", { class: "date num" }, [d.select_date, el("span", { class: "buy-inline", text: "买入 " + buy })]),
            el("td", { class: "buy num", text: buy }),
            el("td", null, chips)
          ]));
        });
        tableHost.appendChild(el("table", { class: "hist" }, [
          el("thead", null, el("tr", null, [el("th", { text: "选股日" }), el("th", { class: "buy", text: "买入" }), el("th", { text: "股票及计划仓位" })])),
          tbody
        ]));
      }
      pageText.textContent = "第 " + (state.page + 1) + " / " + pages + " 页";
      prev.disabled = state.page <= 0;
      next.disabled = state.page >= pages - 1;
      pager.style.display = rows.length > PAGE ? "" : "none";
    }

    search.addEventListener("input", function () { state.q = search.value; state.page = 0; render(); });
    prev.addEventListener("click", function () { state.page -= 1; render(); });
    next.addEventListener("click", function () { state.page += 1; render(); });
    render();

    return el("section", { class: "card" }, [
      el("div", { class: "card-head" }, [el("div", null, [el("h3", { text: "历史每日选股" }), countNode]), search]),
      tableHost,
      pager
    ]);
  }

  // ---------- 口径说明 ----------
  function renderNotes(s) {
    var items = [];
    var startsAtFirstDay = s.base_date >= s.oos_start_date;
    if (startsAtFirstDay) {
      items.push("收益计算：以回测首日 " + s.base_date + " 的净值为 1，按回测账户每日净值折算。");
    } else {
      items.push("收益计算：以样本外起点前一个交易日 " + s.base_date + " 的收盘净值为 1，按回测账户每日净值折算。账户在起点前已经在运行，起点当天沿用此前选出的持仓。");
    }
    items.push("回撤：当前回撤是最新净值相对样本外期内最高净值的跌幅；最大回撤是样本外期内从任一高点到其后低点的最大跌幅。");
    items.push("年化收益按自然日折算" +
      (s.chart_range ? "；全历史年化从 " + s.chart_range.start_date + " 算起，样本外年化从样本外起点算起" : "") +
      "；区间不足 60 个交易日时不计算年化。");
    var fees = [];
    if (s.fees) {
      var c = fmtFee(s.fees.commission, "万分之", 10000);
      var t = fmtFee(s.fees.stamp_tax, "千分之", 1000);
      if (c) fees.push("佣金" + c);
      if (t) fees.push("印花税" + t);
    }
    items.push("成交模拟：按 A 股规则（整手、涨跌停、T+1）模拟成交" + (fees.length ? "，费用按" + fees.join("、") + "计算" : "") + "。");
    items.push("计划仓位：该股票占账户总资产的目标比例" + (s.intraday_timing ? "；策略启用了盘中择时，实际是否买入及仓位以盘中信号为准" : "") + "。");
    items.push("历史选股：只列出样本外起点之后的选股日，是按当前策略规则对历史数据计算的结果，不是当时实时发布的记录。");
    items.push("样本外：自 " + s.oos_start_date + " 起的数据没有参与策略参数的确定" +
      (s.chart_range ? "；净值走势切换到更早的起点时，样本外部分以浅色底纹标出" : "") + "。");
    items.push("净值来源：" + (s.equity_source || "回测资金曲线") + "。");
    return el("section", { class: "card notes" }, [
      el("h3", { text: "口径说明" }),
      el("ul", null, items.map(function (t) { return el("li", { text: t }); }))
    ]);
  }

  route(false);
})();
</script>
