<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="description" content="回测报告与交易执行分析报告，在线查看完整数据和交互图表。">
  <title>报告目录｜HTML Report</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #14263f; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 48px, 920px); margin: 88px auto; }
    .eyebrow { color: #526782; font-size: 12px; font-weight: 600; letter-spacing: .16em; }
    h1 { margin: 14px 0 12px; font-size: clamp(30px, 5vw, 40px); letter-spacing: -.04em; }
    .intro { margin: 0; color: #53657e; line-height: 1.8; }
    .reports { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 40px; }
    .report { display: flex; flex-direction: column; padding: 30px; border: 1px solid #dae2ee; border-radius: 14px; background: white; text-decoration: none; color: inherit; transition: border-color .15s, box-shadow .15s; }
    .report:hover { border-color: #6986b3; box-shadow: 0 8px 24px #1831530b; }
    .report:focus-visible { outline: 3px solid #2b60d5; outline-offset: 5px; }
    .number { color: #7a8ba4; font-size: 12px; letter-spacing: .08em; }
    h2 { margin: 23px 0 12px; font-size: 24px; }
    .description { color: #53657e; line-height: 1.8; margin: 0 0 28px; font-size: 15px; }
    .open { margin-top: auto; color: #2355b5; font-size: 14px; font-weight: 600; }
    footer { margin-top: 28px; color: #78869a; font-size: 13px; line-height: 1.8; }
    @media (max-width: 620px) { main { width: calc(100% - 32px); margin: 44px auto; } .reports { grid-template-columns: 1fr; margin-top: 28px; } .report { padding: 26px; } }
    @media (prefers-reduced-motion: reduce) { .report { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">HTML REPORT</div>
    <h1>报告目录</h1>
    <p class="intro">查看回测表现与交易执行分析，浏览完整数据和交互图表。</p>
    <div class="reports">
      <a class="report" href="backtest.html">
        <span class="number">01 / BACKTEST</span>
        <h2>回测报告</h2>
        <p class="description">策略收益、资金曲线、回撤表现与交易统计。</p>
        <span class="open">打开回测报告 <span aria-hidden="true">→</span></span>
      </a>
      <a class="report" href="execution-analysis.html">
        <span class="number">02 / EXECUTION ANALYSIS</span>
        <h2>交易执行分析报告</h2>
        <p class="description">执行算法、交易完成率、成本分解与成交容量。</p>
        <span class="open">打开交易执行分析报告 <span aria-hidden="true">→</span></span>
      </a>
    </div>
    <footer>报告支持交互浏览。文件较大，首次打开时请稍候。</footer>
  </main>
</body>
</html>
